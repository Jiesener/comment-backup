<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>评论备份站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
     background:#f4f5f7;color:#1f2328;min-height:100vh;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:17px;font-weight:600}
.acct{font-size:12px;color:#fff;background:#2f6fed;padding:4px 10px;border-radius:999px;white-space:nowrap}
.acct.warn{background:#c2410c}
.rows{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-size:12px;color:#4b5563;background:#fff;border:1px solid #e5e7eb;padding:4px 10px;border-radius:999px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}
textarea{width:100%;min-height:168px;padding:14px;border:1px solid #e5e7eb;border-radius:10px;
     font-size:15px;line-height:1.75;resize:vertical;background:#fbfbfc;color:#1f2328;
     font-family:inherit;word-break:break-word}
.btns{display:flex;gap:10px;margin-top:12px}
button{flex:1;padding:14px;border:0;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
     background:#2f6fed;color:#fff;font-family:inherit}
button.sec{background:#eef0f3;color:#4b5563;flex:0 0 auto;padding-left:18px;padding-right:18px}
button:active{opacity:.85}
button:disabled{opacity:.45}
.empty{text-align:center;padding:44px 10px;color:#6b7280;font-size:14px;line-height:2}
.hint{font-size:12px;color:#6b7280;line-height:1.7;margin-top:10px}
.empty .big{font-size:30px;display:block;margin-bottom:8px}
.list{display:grid;gap:10px}
.list a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;
     background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;color:#1f2328;font-size:15px}
.list a span{font-size:12px;color:#9ca3af}
.foot{margin-top:14px;font-size:11px;color:#9ca3af;line-height:1.9;text-align:center}
.err{color:#b91c1c}
.toast{position:fixed;left:50%;bottom:38px;transform:translate(-50%,26px);opacity:0;transition:.26s;
     background:#111827;color:#fff;font-size:14px;padding:11px 20px;border-radius:999px;z-index:9;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>评论备份站</h1>
    <span class="acct" id="acct">—</span>
  </div>
  <div class="rows">
    <span class="chip" id="cnt">剩余 — 条</span>
    <span class="chip" id="used">本机已取 0</span>
    <span class="chip" id="synced">—</span>
  </div>
  <div class="card" id="card"><div class="empty"><span class="big">⏳</span>加载中…</div></div>
  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var ACCT = (q.get('u') || '').trim();
  var DEV = localStorage.getItem('cb_dev');
  if (!DEV) { DEV = 'd' + Math.random().toString(36).slice(2, 10); localStorage.setItem('cb_dev', DEV); }

  var DATA = null, KEY = '', POOL = [], USED = {}, CUR = '', S0 = 0, OFF = 0;

  function h(s) { var x = 0, i; for (i = 0; i < s.length; i++) { x = ((x << 5) - x + s.charCodeAt(i)) | 0; } return Math.abs(x); }
  function id(t) { return String(h(t)); }
  // 按设备号确定性分散：起点 = h(设备号) % 池大小，取条时顺序往后找第一个未用的。
  // 比纯随机好——不同手机天然落在池子不同位置，撞车概率大幅降低（原来是 1/N 每次刷新都重掷）。
  function pickIndex() {
    var n = POOL.length, k, i;
    for (k = 0; k < n; k++) {
      i = (S0 + OFF + k) % n;
      if (!USED[id(POOL[i])]) { OFF += k + 1; return i; }
    }
    return -1;
  }
  function toast(m) { var e = document.getElementById('toast'); e.textContent = m; e.className = 'toast on'; setTimeout(function () { e.className = 'toast'; }, 1700); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function saveUsed() { try { localStorage.setItem('cb_used_' + KEY, JSON.stringify(Object.keys(USED))); } catch (e) {} }
  function loadUsed() { try { return JSON.parse(localStorage.getItem('cb_used_' + KEY) || '[]'); } catch (e) { return []; } }
  function remaining() { return POOL.filter(function (t) { return !USED[id(t)]; }); }

  function renderAccounts() {
    var a = DATA.accounts || {}, ks = Object.keys(a).sort(), html = '';
    if (!ks.length) { ks = Object.keys(DATA.pools || {}).sort(); a = {}; }
    ks.forEach(function (k) {
      var n = ((DATA.pools || {})[a[k] || k] || []).length;
      html += '<a href="?u=' + encodeURIComponent(k) + '"><b>?u=' + esc(k) + '</b><span>' + n + ' 条</span></a>';
    });
    document.getElementById('acct').textContent = '未指定账号';
    document.getElementById('acct').className = 'acct warn';
    document.getElementById('cnt').textContent = '可用账号 ' + ks.length + ' 个';
    document.getElementById('used').style.display = 'none';
    document.getElementById('card').innerHTML = '<div class="list">' + html + '</div>';
  }

  function render() {
    var rem = remaining(), usedN = Object.keys(USED).length;
    document.getElementById('cnt').textContent = '剩余 ' + rem.length + ' 条';
    document.getElementById('used').textContent = '本机已取 ' + usedN;
    var box = document.getElementById('card');
    if (!POOL.length) {
      box.innerHTML = '<div class="empty"><span class="big">📭</span>这个池是空的</div>'; return;
    }
    if (usedN >= POOL.length) {
      box.innerHTML = '<div class="empty"><span class="big">✅</span>本机已经把 ' + POOL.length + ' 条全取完了<br>' +
        '<button class="sec" style="margin-top:14px;padding:10px 18px" id="rs">重置本机记录</button></div>';
      document.getElementById('rs').onclick = function () {
        USED = {}; saveUsed(); CUR = ''; OFF = 0; pick(); toast('已重置本机记录');
      };
      return;
    }
    if (!CUR || USED[id(CUR)]) { var i0 = pickIndex(); CUR = i0 < 0 ? '' : POOL[i0]; }
    box.innerHTML =
      '<textarea id="ta" readonly>' + esc(CUR) + '</textarea>' +
      '<div class="btns"><button id="cp">复制这条</button><button class="sec" id="sk">换一条</button></div>' +
      '<p class="hint">💡 取过的那条只记在本机，不会从备份池里删除（原站会删）。所以换一台设备可能拿到同一条。</p>';
    document.getElementById('cp').onclick = doCopy;
    document.getElementById('sk').onclick = function () { CUR = ''; pick(); };
  }

  function pick() {
    var i = pickIndex();
    if (i < 0) { CUR = ''; render(); return; }
    CUR = POOL[i];
    render();
  }

  function doCopy() {
    if (!CUR) { return; }
    var t = CUR, btn = document.getElementById('cp');
    if (btn) { btn.disabled = true; }
    function done() {
      USED[id(t)] = 1; saveUsed();
      toast('已复制 · 本机不再重复给这条');
      CUR = ''; pick();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, function () {
        var ta = document.getElementById('ta'); ta.select(); ta.setSelectionRange(0, 99999);
        var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
        if (ok) { done(); } else { toast('复制失败，请长按手动复制'); if (btn) { btn.disabled = false; } }
      });
    } else {
      var ta = document.getElementById('ta'); ta.select(); ta.setSelectionRange(0, 99999);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      if (ok) { done(); } else { toast('复制失败，请长按手动复制'); if (btn) { btn.disabled = false; } }
    }
  }

  fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json();
  }).then(function (d) {
    DATA = d;
    if (!DATA.pools) { throw new Error('数据格式不对'); }
    var set = document.getElementById('synced');
    set.textContent = '数据 ' + (DATA.updated || '?').slice(5, 16);
    document.getElementById('foot').innerHTML =
      '只读备份 · 数据源 ' + esc(DATA.source || 'NAS') + '<br>' +
      '本页不写入任何数据，取了哪条只记在本机浏览器里';
    if (!ACCT) { renderAccounts(); return; }
    if (!(ACCT in (DATA.accounts || {})) && !(ACCT in DATA.pools)) {
      document.getElementById('acct').textContent = ACCT;
      document.getElementById('acct').className = 'acct warn';
      document.getElementById('cnt').textContent = '账号不存在';
      document.getElementById('used').style.display = 'none';
      document.getElementById('card').innerHTML = '<div class="empty"><span class="big">⚠️</span>没有这个账号：' + esc(ACCT) +
        '<br><button class="sec" style="margin-top:14px;padding:10px 18px" onclick="location.search=\'\'">看可用账号</button></div>';
      return;
    }
    KEY = (DATA.accounts || {})[ACCT] || ACCT;
    POOL = (DATA.pools[KEY] || []).slice();
    USED = {};
    loadUsed().forEach(function (k) { USED[k] = 1; });
    S0 = POOL.length ? h(DEV) % POOL.length : 0;
    OFF = 0;
    document.getElementById('acct').textContent = ACCT + (KEY !== ACCT ? ' · ' + KEY + '池' : '');
    document.getElementById('acct').className = 'acct';
    pick();
  }).catch(function (e) {
    document.getElementById('card').innerHTML = '<div class="empty err"><span class="big">⚠️</span>数据加载失败<br><small>' + esc(e.message) + '</small></div>';
  });
})();
</script>
</body>
</html>
